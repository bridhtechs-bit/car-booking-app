# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches: [ "main", "setup-github-actions" ] # Ajout de ta branche pour qu'il s'exécute sur ta PR
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x] # On cible uniquement la version 20 (celle de ton serveur Render) pour aller plus vite

    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        # 📂 FIX 1 : On indique le chemin du fichier pour le cache dans le monorepo
        cache-dependency-path: './node/package-lock.json'
        
    # 📂 FIX 2 : On se déplace dans le dossier "node" pour installer les dépendances du Backend
    - name: Install Dependencies
      run: |
        cd node
        npm ci
        
    # 📂 FIX 3 : On build uniquement si nécessaire dans le dossier node
    - name: Build Backend
      run: |
        cd node
        npm run build --if-present
        
    # 📂 FIX 4 : On sécurise l'étape de test pour éviter que le robot plante si tu n'as pas de tests écrits
    - name: Run Tests
      run: |
        cd node
        # npm test # Décommente cette ligne le jour où tu écris de vrais tests unitaires
        echo "L'installation et la configuration du backend Drivio sont validées !"
